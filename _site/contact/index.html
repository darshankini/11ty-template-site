<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us &middot; DevBlog</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="/">
                <img src="/assets/logo.svg" alt="DevBlog logo" width="150" height="40">
            </a>
            <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <nav class="site-nav">
                <ul>
                    
                    <li>
                        <a href="/"
                           class="">Home</a>
                    </li>
                    
                    <li>
                        <a href="/blog/"
                           class="">Blog</a>
                    </li>
                    
                    <li>
                        <a href="/contact/"
                           class="active">Contact Us</a>
                    </li>
                    
                </ul>
            </nav>
        </div>
    </header>

    <main>
        
<section class="container section">
    <h1 class="page-title">Contact Us</h1>
    <p class="page-subtitle">Have a question or want to work together? Send a message.</p>

    <div class="contact-grid">
        <form class="contact-form" onsubmit="return false;">
            <label>Name
                <input type="text" name="name" placeholder="Your name" required>
            </label>
            <label>Email
                <input type="email" name="email" placeholder="you@example.com" required>
            </label>
            <label>Subject
                <input type="text" name="subject" placeholder="How can we help?">
            </label>
            <label>Message
                <textarea name="message" rows="6" placeholder="Write your message..." required></textarea>
            </label>
            <button type="submit" class="btn">Send Message</button>
        </form>

        <aside class="contact-info">
            <h3>Reach us</h3>
            <p><strong>Email</strong><br>hello@devblog.example</p>
            <p><strong>Phone</strong><br>+91 00000 00000</p>
            <p><strong>Address</strong><br>123 Web Street,<br>Internet City</p>
        </aside>
    </div>
</section>

    </main>

    <footer class="site-footer">
        <div class="container">
            <p>All rights reserved &copy; 2026 DevBlog</p>
        </div>
    </footer>

    <script src="/script.js"></script>
</body>
</html>
