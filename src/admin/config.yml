backend:
  name: git-gateway
  branch: main

# Where uploaded images are stored (in the repo) and how they're referenced in posts
media_folder: "src/assets"
public_folder: "/assets"

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/blog"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}  —  {{date}}"
    sortable_fields: ["date", "title", "views"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Views", name: "views", widget: "number", default: 0, value_type: "int", min: 0 }
      - { label: "Image", name: "image", widget: "image", required: false, media_library: { config: { multiple: false } } }
      - { label: "Short Description", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
